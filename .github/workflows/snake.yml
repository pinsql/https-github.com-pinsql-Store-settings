name: snake

# Regenerates the contribution-snake SVGs shown in the profile README
# and publishes them to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#161b22,#3d1236,#7a1f6b,#c2369f,#ff4fd8
            dist/snake-light.svg?color_snake=#c2369f&color_dots=#ebedf0,#ffd6f5,#ff9be8,#ff4fd8,#c2369f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
